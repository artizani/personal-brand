<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff;}
a{color:#2f5fe0;}
a:hover{color:#1c3fa8;}
</style>
</helmet>
<div style="font-family:'Archivo',sans-serif;background:#ffffff;color:#111111;">
<dc-import name="Header" active="writing" hint-size="100%,90px"></dc-import>

<section style="max-width:1360px;margin:0 auto;padding:50px 5vw 70px;background:#fafafa;">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;"><span style="width:16px;height:1px;background:#111111;"></span><span style="font-size:11px;font-weight:700;letter-spacing:0.08em;">WRITING</span></div>
  <h1 style="font-size:clamp(30px,4.4vw,48px);font-weight:800;line-height:1.1;margin:0 0 18px;max-width:640px;letter-spacing:-0.02em;">Thinking beyond technology.</h1>
  <p style="font-size:15px;line-height:1.6;color:#5a5a5a;max-width:560px;margin:0;">Notes on technology, leadership, infrastructure and the decisions that determine whether systems survive at scale.</p>
</section>

<section style="max-width:1360px;margin:0 auto;padding:60px 5vw 90px;">
  <div style="font-size:11px;font-weight:700;letter-spacing:0.08em;color:#8a8a8a;margin-bottom:18px;">LATEST WRITINGS</div>
  <div style="border-top:1px solid #e5e5e5;">
    <sc-for list="{{ posts }}" as="post" hint-placeholder-count="5">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;padding:26px 24px;background:#f7f7f7;border-left:3px solid #111111;margin-top:16px;">
        <div style="flex:1;min-width:240px;">
          <div style="font-size:18px;font-weight:800;margin-bottom:8px;">{{ post.title }}</div>
          <div style="font-size:13px;color:#8a8a8a;">{{ post.summary }}</div>
        </div>
        <a href="#" style="border:1px solid #cfcfcf;padding:12px 22px;font-size:11px;font-weight:700;letter-spacing:0.05em;text-decoration:none;color:#111111;white-space:nowrap;">READ</a>
      </div>
    </sc-for>
  </div>
</section>

<dc-import name="Footer" hint-size="100%,480px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      posts: [
        { title: "Why most technical leadership fails at scale", summary: "Competence doesn't collapse systems. Poor judgment does." },
        { title: "The difference between software that demos well and software that survives reality", summary: "Most teams optimize for the wrong feedback loops." },
        { title: "Security is an operational problem, not a tooling problem", summary: "Tools don't enforce discipline. Systems do." },
        { title: "What large organizations actually need from engineers", summary: "It's not cleverness. It's judgment under constraints." },
        { title: "Why compliance software is a trust problem, not a UX problem", summary: "Most fintech teams ship features. Few ship confidence." },
      ],
    };
  }
}
</script>
</body>
</html>
