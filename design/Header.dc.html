<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</helmet>
<header style="display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:26px 5vw;max-width:1360px;margin:0 auto;font-family:'Archivo',sans-serif;background:#ffffff;">
  <a href="./Home.dc.html" style="font-size:14px;font-weight:800;letter-spacing:0.06em;color:#111111;text-decoration:none;">DAVID SALAMI</a>
  <nav style="display:flex;gap:32px;align-items:center;flex-wrap:wrap;">
    <a href="./Writing.dc.html" style="font-size:12px;font-weight:600;letter-spacing:0.05em;color:{{ writingColor }};text-decoration:none;">WRITING</a>
    <a href="./Company.dc.html" style="font-size:12px;font-weight:600;letter-spacing:0.05em;color:{{ companyColor }};text-decoration:none;">COMPANY</a>
    <a href="./Speaking.dc.html" style="font-size:12px;font-weight:600;letter-spacing:0.05em;color:{{ speakingColor }};text-decoration:none;">SPEAKING</a>
    <a href="./About.dc.html" style="font-size:12px;font-weight:600;letter-spacing:0.05em;color:{{ aboutColor }};text-decoration:none;">ABOUT</a>
  </nav>
  <a href="./WorkWithMe.dc.html" style="border:1px solid #111111;padding:11px 22px;font-size:11px;font-weight:700;letter-spacing:0.05em;color:#111111;text-decoration:none;white-space:nowrap;">WORK WITH ME</a>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;&quot;,&quot;writing&quot;,&quot;company&quot;,&quot;speaking&quot;,&quot;about&quot;]}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || '';
    const c = (name) => active === name ? '#111111' : '#7a7a7a';
    return {
      writingColor: c('writing'),
      companyColor: c('company'),
      speakingColor: c('speaking'),
      aboutColor: c('about'),
    };
  }
}
</script>
</body>
</html>
